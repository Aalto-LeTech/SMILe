name: Test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jvm-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: sbt

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      # The pnpm version is the packageManager of package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node for Scala.js tests
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: pnpm

      - name: Install the jsdom test environment
        run: pnpm install --frozen-lockfile

      # One sbt process runs the format checks and every suite, which are the JVM ones, the
      # Scala.js ones under jsdom, and the parity harness's probes without a browser. sbt starts
      # and loads the project once.
      - name: Check formatting and run all tests
        run: sbt fullCheck

      - name: Upload visual test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visual-test-results
          path: target/out/jvm/*/smile/visual-test-results
          if-no-files-found: ignore

  # The Scala.js suites in headless Chromium, which runs the tests of SVG text metrics and image
  # decoding that jsdom skips, and then AWT, canvas and SVG compared in pairs at 1x, 2x and 1.5x,
  # with the JVM driving the same Chromium. A disagreement fails the workflow, and the uploaded
  # report shows it.
  browser-tests:
    name: Browser tests and cross-backend parity
    runs-on: ubuntu-latest
    # Chromium is installed below. Without this the Java driver also fetches Firefox and WebKit.
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: sbt

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "26"

      # The same Playwright release as the build uses, since each release pins its Chromium
      # build. Playwright's CLI also installs Chromium's system libraries, which include
      # Liberation Sans, the font the parity text cases use on Linux.
      - name: Install Playwright's browsers
        run: pnpm dlx "playwright@$(cat project/playwright.version)" install --with-deps chromium

      - name: Run Scala.js tests in headless Chromium
        run: sbt -Dsmile.browser=true smileJS/testFull

      - name: Compare AWT, canvas and SVG
        run: sbt -Dsmile.parity=true parityJVM/testFull

      - name: Upload the parity report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: parity-report
          path: target/out/jvm/*/smile-parity/visual-test-results
          if-no-files-found: ignore
